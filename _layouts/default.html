
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

<header>
    <div class="wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="HIROPASS トップページ">
            HIROPASS
        </a>
    </div>
</header>

<main class="wrap{% unless page.home %} legal{% endunless %}">
    {{ content }}
</main>

<footer>
    <div class="wrap">
        {% if page.home %}
        <p>お問い合わせ：
            <a class="contact" href="mailto:hiropass27@gmail.com">
                hiropass27@gmail.com
            </a>
        </p>
        {% else %}
        <a class="contact" href="{{ '/privacy.html' | relative_url }}">
            お問い合わせ先（プライバシーポリシー）
        </a>
        {% endif %}
        <p>運営：hiropass開発チーム</p>
        <p>
            hiropassは学生有志が開発・運営する非公式サービスであり、<br>
            広島大学が公式に提供・運営するものではありません。
        </p>
        <p class="copyright">
            © 2026 hiropass Development Team
        </p>
    </div>
</footer>

</body>
</html>
